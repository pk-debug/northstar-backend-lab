server.port=${SERVER_PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./northstar;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
# No JPA here: explicit SQL makes transaction boundaries easy to understand.
